# /etc/nginx/sites-available/fersped
# fersped.booking-demo.dev — Laravel (certbot will add the SSL block)
server {
    listen 80;
    listen [::]:80;
    server_name fersped.booking-demo.dev;
    root /var/www/fersped/public;

    index index.php;
    charset utf-8;
    client_max_body_size 64M;

    # Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets — long cache
    location ~* \.(webp|jpe?g|png|gif|svg|ico|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Documents (PDF/Word archives)
    location /media/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location ~ \.php$ {
        # adjust the socket to the PHP version installed on the server
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
